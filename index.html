<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealPulse AI - Sales Coaching & Call Intelligence</title>
    <meta name="description" content="AI-powered sales coaching intelligence platform with audio call transcription, speaker diarization, continuous sentiment and engagement graphs, and tactical coaching cards." />
    <meta property="og:title" content="DealPulse AI - Sales Coaching & Call Intelligence" />
    <meta property="og:description" content="AI-powered sales coaching intelligence platform with audio call transcription, speaker diarization, continuous sentiment and engagement graphs, and tactical coaching cards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Ignore harmless Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.message || '').includes('WebSocket') ||
          String(event.reason?.stack || '').includes('@vite/client')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          String(event.filename || '').includes('@vite/client') ||
          String(event.message || '').includes('WebSocket')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation?.();
        }
      });
    </script>
  </head>
  <body class="h-full bg-slate-950 font-sans antialiased text-slate-100 selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
